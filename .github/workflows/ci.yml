name: Math Mentor LMS CI

on:
  push:
    branches: [main, safe-optimization]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & security tests (Vitest)
        run: npx vitest run

      - name: Type-check & production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Verify zero source maps in production bundle
        run: |
          if find dist -name "*.map" | grep -q .; then
            echo "ERROR: Source maps found in dist/!"
            exit 1
          fi
          echo "Verified: 0 source maps in dist/"
