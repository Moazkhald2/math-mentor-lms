name: Apply DB Migrations

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migration-006-question-params.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: node scripts/migrate.mjs

      - name: Verify params column exists
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          node -e "
          const pg = require('pg');
          const c = new pg.Client({ connectionString: process.env.SUPABASE_DATABASE_URL, ssl: { rejectUnauthorized: false } });
          c.connect().then(async () => {
            const r = await c.query(\"SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='questions' AND column_name='params'\");
            if (r.rows.length === 1) { console.log('✅ VERIFIED: questions.params column exists'); }
            else { console.error('❌ VERIFICATION FAILED: params column missing'); process.exit(1); }
            await c.end();
          }).catch(e => { console.error(e.message); process.exit(1); });
          "
