name: Daily Backup

on:
  schedule:
    - cron: '0 4 * * *' # daily 4am UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
      - run: npm ci --omit=dev
      - name: Run backup
        run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      - name: Commit backup if changed
        run: |
          if [ -f backups/backup-*.json ]; then
            git config user.name "backup-bot"
            git config user.email "backup@mathmentor.local"
            git add backups/ || true
            git diff --staged --quiet || git commit -m "chore(backup): daily backup $(date +%Y-%m-%d)" || true
            git push || echo "No push needed"
          fi
